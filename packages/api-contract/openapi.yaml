openapi: 3.1.0

info:
  title: AI Fullstack Starter API
  version: 1.0.0
  description: |
    Versioned, language-neutral API contract shared by all clients
    (web, mobile) and implemented by every backend (FastAPI reference
    today; Node/Express or others later).

    Rules (docs/architecture/ADR-001..ADR-004):
    - This file is the sole source of truth for the API boundary.
      Changes are additive-only within v1; breaking changes require
      /api/v2 plus an ADR.
    - Nothing language-specific crosses the boundary: errors use the
      Error code registry, never exception class names or framework
      shapes.
    - v1 has no authentication; user_id is an anonymous client-supplied
      scope, not an identity.

servers:
  - url: http://127.0.0.1:8000
    description: Local development

tags:
  - name: health
    description: Liveness probes
  - name: chat
    description: Prompt in, completion out
  - name: learning
    description: Adaptive learning state and answer evaluation
  - name: agent
    description: |
      Agent control plane: sessions, tasks, events, approvals, and
      consolidated state. Tasks are accepted for execution (202) and
      progress is observable via event replay or SSE streams.

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    version: "1.0.0"

  /api/v1/chat:
    post:
      operationId: createChat
      tags: [chat]
      summary: Send a prompt; receive a completion (JSON or SSE stream)
      description: |
        With `stream: false` (default) responds with a single JSON
        ChatResponse.

        With `stream: true` responds with `text/event-stream` (ADR-003):
        one or more `delta` events carrying content fragments, then
        exactly one terminal event — `message` carrying the full
        ChatResponse on success, or `error` carrying an ErrorResponse
        on failure. The stream always closes after the terminal event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            examples:
              jsonMode:
                value:
                  prompt: "Explain API contracts in one sentence."
                  user_id: anonymous
              streamMode:
                value:
                  prompt: "Explain API contracts in one sentence."
                  stream: true
      responses:
        "200":
          description: Completion (JSON mode) or SSE stream (stream mode).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE event stream; every event payload is JSON.
                  - event `delta`: SseDeltaEvent
                  - event `message`: ChatResponse (terminal, success)
                  - event `error`: ErrorResponse (terminal, failure)
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /api/v1/learning/state:
    get:
      operationId: getLearningState
      tags: [learning]
      summary: Get learning state for a concept
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: concept
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Current learning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningStateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/learning/answer:
    post:
      operationId: answerLearningQuestion
      tags: [learning]
      summary: Evaluate an answer and update learning state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningAnswerRequest"
      responses:
        "200":
          description: Answer evaluation and updated learning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningAnswerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/learning/quiz:
    get:
      operationId: getLearningQuiz
      tags: [learning]
      summary: Get a retention quiz question
      parameters:
        - name: concept
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Quiz question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningQuizResponse"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/learning/quiz/answer:
    post:
      operationId: answerLearningQuiz
      tags: [learning]
      summary: Evaluate a retention quiz answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningQuizAnswerRequest"
      responses:
        "200":
          description: |
            Quiz result, updated learning state, and adaptive teaching
            information. When the answer is incorrect, the response includes
            the correct answer, explanation, and targeted practice question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningQuizAnswerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/learning/quiz/practice:
    post:
      operationId: answerLearningPractice
      tags: [learning]
      summary: Evaluate targeted practice after adaptive teaching
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningPracticeAnswerRequest"
      responses:
        "200":
          description: Targeted practice result and updated learning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPracticeAnswerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/learning/quiz/retest:
    get:
      operationId: getLearningRetest
      tags: [learning]
      summary: Get a fresh retention retest question
      parameters:
        - name: concept
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Fresh retest question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningRetestResponse"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: answerLearningRetest
      tags: [learning]
      summary: Evaluate a retest answer and update mastery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningRetestAnswerRequest"
      responses:
        "200":
          description: Retest result and updated learning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningRetestAnswerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/agent/sessions:
    post:
      operationId: createAgentSession
      tags: [agent]
      summary: Create an agent session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentSessionRequest"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/agent/sessions/{session_id}:
    get:
      operationId: getAgentSession
      tags: [agent]
      summary: Retrieve an agent session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/agent/sessions/{session_id}/tasks:
    post:
      operationId: submitAgentTask
      tags: [agent]
      summary: Submit a task to an agent session
      description: |
        Accepts the task for execution (202) and records a
        `task_accepted` event. Execution is driven by the backend's
        agent worker; clients observe progress through the event
        replay or stream endpoints.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAgentTaskRequest"
      responses:
        "202":
          description: Task accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/agent/sessions/{session_id}/events:
    get:
      operationId: listAgentEvents
      tags: [agent]
      summary: List agent events for a session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Only return events with sequence greater than this value.
      responses:
        "200":
          description: Ordered agent events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentEventResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/agent/sessions/{session_id}/events/stream:
    get:
      operationId: streamAgentEvents
      tags: [agent]
      summary: Stream agent events for a session as SSE
      description: |
        Responds with `text/event-stream`. Each frame carries an
        `event` name matching the event_type and a JSON `data`
        payload shaped as AgentEventResponse. Events already stored
        before the stream opens are replayed first, honouring
        `after_sequence`.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE event stream; every event payload is JSON.
                  - event name: one of the AgentEventResponse
                    event_type values
                  - data: AgentEventResponse
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/agent/sessions/{session_id}/approvals:
    get:
      operationId: listAgentApprovals
      tags: [agent]
      summary: List approval requests for a session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval requests, most recent first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/agent/sessions/{session_id}/approvals/{approval_id}:
    post:
      operationId: decideAgentApproval
      tags: [agent]
      summary: Decide a pending approval request
      description: |
        Records an approval decision exactly once: repeating the same
        decision is idempotent and returns the stored approval without
        emitting a duplicate `approval_decided` event. Approvals that
        do not belong to the session are rejected with the error
        envelope.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: Approval after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/agent/sessions/{session_id}/state:
    get:
      operationId: getAgentState
      tags: [agent]
      summary: Retrieve consolidated state for an agent session
      description: |
        Returns the session, its tasks, its full event history, and
        pending approvals in one snapshot. The endpoint remains
        readable after an approval has been consumed.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Consolidated session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/agent/sessions/{session_id}/tasks/{task_id}/events:
    get:
      operationId: listAgentTaskEvents
      tags: [agent]
      summary: Replay agent events for a specific task
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: task_id
          in: path
          required: true
          schema:
            type: string
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Event replay page with continuation cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEventReplayResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/agent/sessions/{session_id}/tasks/{task_id}/events/stream:
    get:
      operationId: streamAgentTaskEvents
      tags: [agent]
      summary: Stream agent events for a specific task as SSE
      description: |
        Responds with `text/event-stream`. Each frame carries an
        `event` name matching the event_type and a JSON `data`
        payload shaped as AgentEventResponse. Stored events are
        replayed first, honouring `after_sequence`.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: task_id
          in: path
          required: true
          schema:
            type: string
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE event stream; every event payload is JSON.
                  - event name: one of the AgentEventResponse
                    event_type values
                  - data: AgentEventResponse
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  responses:
    InvalidRequest:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            emptyPrompt:
              value:
                error:
                  code: invalid_request
                  message: "prompt must be a non-empty string"

    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    RateLimited:
      description: Too many requests; retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ProviderError:
      description: The AI provider returned an error or malformed output.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ProviderUnavailable:
      description: The requested AI provider is not configured or unreachable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Optional implementation or contract version.

    ChatRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        user_id:
          type: [string, "null"]
          description: |
            Anonymous scoping value (ADR-004), not an identity.
            Servers default to "anonymous" when absent.
        stream:
          type: boolean
          default: false
          description: When true, respond with an SSE event stream.

    ChatMessage:
      type: object
      required: [id, role, content, finish_reason]
      properties:
        id:
          type: string
        role:
          const: assistant
        content:
          type: string
        finish_reason:
          type: string
          enum: [stop, length]

    Usage:
      type: [object, "null"]
      description: Token accounting when the implementation provides it.
      properties:
        input_tokens:
          type: [integer, "null"]
          minimum: 0
        output_tokens:
          type: [integer, "null"]
          minimum: 0

    ChatResponse:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/ChatMessage"
        usage:
          $ref: "#/components/schemas/Usage"

    LearningStateResponse:
      type: object
      required:
        - user_id
        - concept
        - mastery
        - attempts
        - correct_count
        - next_review_at
      properties:
        user_id:
          type: string
        concept:
          type: string
        mastery:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        correct_count:
          type: integer
          minimum: 0
        last_misconception:
          type: [string, "null"]
        next_review_at:
          type: [string, "null"]
          format: date-time

    LearningAnswerRequest:
      type: object
      required:
        - user_id
        - concept
        - answer
      properties:
        user_id:
          type: string
          minLength: 1
        concept:
          type: string
          minLength: 1
        answer:
          type: string
          minLength: 1

    TeachingResponse:
      type: object
      required:
        - explanation
        - practice_question
        - choices
      properties:
        explanation:
          type: string
        practice_question:
          type: string
        choices:
          type: array
          items:
            type: string

    LearningAnswerResponse:
      type: object
      required:
        - user_id
        - concept
        - is_correct
        - mastery_before
        - mastery_after
        - attempts
        - correct_count
        - next_review_at
      properties:
        user_id:
          type: string
        concept:
          type: string
        is_correct:
          type: boolean
        misconception:
          type: [string, "null"]
        mastery_before:
          type: number
          minimum: 0
          maximum: 1
        mastery_after:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        correct_count:
          type: integer
          minimum: 0
        next_review_at:
          type: [string, "null"]
          format: date-time
        teaching:
          $ref: "#/components/schemas/TeachingResponse"

    LearningQuizResponse:
      type: object
      required:
        - concept
        - question
        - choices
        - bloom_level
      properties:
        concept:
          type: string
        question:
          type: string
        choices:
          type: array
          items:
            type: string
        bloom_level:
          type: string
          enum:
            - remember
            - understand
            - apply
            - analyze
            - evaluate
            - create

    LearningQuizAnswerRequest:
      type: object
      required:
        - user_id
        - concept
        - selected_answer
      properties:
        user_id:
          type: string
          minLength: 1
        concept:
          type: string
          minLength: 1
        selected_answer:
          type: string
          minLength: 1

    LearningQuizAnswerResponse:
      type: object
      required:
        - user_id
        - concept
        - is_correct
        - selected_answer
        - correct_answer
        - mastery_before
        - mastery_after
        - attempts
        - correct_count
        - next_review_at
      properties:
        user_id:
          type: string
        concept:
          type: string
        is_correct:
          type: boolean
        selected_answer:
          type: string
        correct_answer:
          type: string
        mastery_before:
          type: number
          minimum: 0
          maximum: 1
        mastery_after:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        correct_count:
          type: integer
          minimum: 0
        next_review_at:
          type: [string, "null"]
          format: date-time
        explanation:
          type: [string, "null"]
        misconception:
          type: [string, "null"]
        practice_question:
          type: [string, "null"]
        practice_choices:
          type: [array, "null"]
          items:
            type: string

    LearningPracticeAnswerRequest:
      type: object
      required:
        - user_id
        - concept
        - selected_answer
      properties:
        user_id:
          type: string
          minLength: 1
        concept:
          type: string
          minLength: 1
        selected_answer:
          type: string
          minLength: 1

    LearningPracticeAnswerResponse:
      type: object
      required:
        - user_id
        - concept
        - is_correct
        - selected_answer
        - correct_answer
        - mastery_before
        - mastery_after
        - attempts
        - correct_count
        - next_review_at
      properties:
        user_id:
          type: string
        concept:
          type: string
        is_correct:
          type: boolean
        selected_answer:
          type: string
        correct_answer:
          type: string
        mastery_before:
          type: number
          minimum: 0
          maximum: 1
        mastery_after:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        correct_count:
          type: integer
          minimum: 0
        next_review_at:
          type: [string, "null"]
          format: date-time
        explanation:
          type: [string, "null"]

    LearningRetestResponse:
      type: object
      required:
        - concept
        - question
        - choices
        - bloom_level
      properties:
        concept:
          type: string
        question:
          type: string
        choices:
          type: array
          items:
            type: string
        bloom_level:
          type: string
          enum:
            - remember
            - understand
            - apply
            - analyze
            - evaluate
            - create

    LearningRetestAnswerRequest:
      type: object
      required:
        - user_id
        - concept
        - selected_answer
      properties:
        user_id:
          type: string
          minLength: 1
        concept:
          type: string
          minLength: 1
        selected_answer:
          type: string
          minLength: 1

    LearningRetestAnswerResponse:
      type: object
      required:
        - user_id
        - concept
        - is_correct
        - selected_answer
        - correct_answer
        - mastery_before
        - mastery_after
        - attempts
        - correct_count
        - next_review_at
      properties:
        user_id:
          type: string
        concept:
          type: string
        is_correct:
          type: boolean
        selected_answer:
          type: string
        correct_answer:
          type: string
        mastery_before:
          type: number
          minimum: 0
          maximum: 1
        mastery_after:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        correct_count:
          type: integer
          minimum: 0
        next_review_at:
          type: [string, "null"]
          format: date-time
        misconception:
          type: [string, "null"]

    CreateAgentSessionRequest:
      type: object
      description: |
        Request body for creating an agent session. All fields are
        optional; an empty object creates an untitled session.
      properties:
        title:
          type: [string, "null"]
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: Free-form client metadata; additive only.

    SubmitAgentTaskRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          description: The task instruction for the agent.
        metadata:
          type: [object, "null"]
          additionalProperties: true

    ApprovalDecisionRequest:
      type: object
      required: [decision]
      description: |
        Decision for a pending approval request. Re-submitting the
        same decision is idempotent.
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        rationale:
          type: [string, "null"]

    AgentSessionResponse:
      type: object
      required:
        - session_id
        - status
        - created_at
        - updated_at
      properties:
        session_id:
          type: string
        status:
          type: string
          enum: [active, idle, completed, error]
        title:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metadata:
          type: [object, "null"]
          additionalProperties: true

    AgentTaskResponse:
      type: object
      required:
        - task_id
        - session_id
        - status
        - prompt
        - created_at
        - updated_at
      properties:
        task_id:
          type: string
        session_id:
          type: string
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - cancelled
            - timed_out
            - blocked
          description: |
            `blocked` means the task is waiting on an approval
            decision; it resumes after an approved action is
            consumed.
        prompt:
          type: string
        result:
          type: [string, "null"]
          description: Final agent output once the task succeeds.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentEventResponse:
      type: object
      required:
        - event_id
        - session_id
        - task_id
        - sequence
        - event_type
        - created_at
      description: |
        A single ordered agent event. `sequence` is strictly
        increasing per task and drives replay cursors.
      properties:
        event_id:
          type: string
        session_id:
          type: string
        task_id:
          type: string
        sequence:
          type: integer
          minimum: 0
        event_type:
          type: string
          enum:
            - assistant_output
            - tool_call
            - tool_result
            - approval_requested
            - approval_decided
            - approval_consumed
            - error
            - completed
            - task_accepted
            - agent_started
          description: |
            `task_accepted` is recorded when a task is submitted.
            `approval_decided` is emitted exactly once per decision.
            `approval_consumed` is emitted when the agent loop
            resumes and consumes an approved action; event replay
            and state endpoints remain readable afterwards.
        payload:
          type: [object, "null"]
          additionalProperties: true
          description: Event-type-specific data; additive only.
        created_at:
          type: string
          format: date-time

    AgentEventReplayResponse:
      type: object
      required: [events]
      description: Event replay page with a continuation cursor.
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AgentEventResponse"
        next_after_sequence:
          type: [integer, "null"]
          description: |
            Cursor to pass as `after_sequence` for the next page;
            null when there are no further events.

    ApprovalRequestResponse:
      type: object
      required:
        - approval_id
        - session_id
        - task_id
        - action_type
        - action_fingerprint
        - status
        - expires_at
        - created_at
        - updated_at
      properties:
        approval_id:
          type: string
        session_id:
          type: string
        task_id:
          type: string
        action_type:
          type: string
          description: Identifier of the action awaiting approval.
        action_payload:
          type: [object, "null"]
          additionalProperties: true
        action_fingerprint:
          type: string
          description: |
            Stable fingerprint of (session, task, action, input);
            identical retried actions map to the same approval.
        status:
          type: string
          enum: [pending, approved, rejected, expired, consumed]
        expires_at:
          type: string
          format: date-time
        consumed_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentStateResponse:
      type: object
      required:
        - session_id
        - session
        - tasks
        - events
        - pending_approvals
      description: Consolidated snapshot of an agent session.
      properties:
        session_id:
          type: string
        session:
          $ref: "#/components/schemas/AgentSessionResponse"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/AgentTaskResponse"
        events:
          type: array
          items:
            $ref: "#/components/schemas/AgentEventResponse"
        pending_approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRequestResponse"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, language-neutral error code registry.
          enum:
            - invalid_request
            - rate_limited
            - provider_error
            - provider_unavailable
            - internal_error
        message:
          type: string
          description: Human-readable explanation, safe to display.
        details:
          type: object
          description: Optional structured context; additive only.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    SseDeltaEvent:
      type: object
      required: [content]
      description: Payload of an SSE `delta` event in stream mode.
      properties:
        content:
          type: string
