openapi: 3.1.0

info:
  title: AI Fullstack Starter API
  version: 1.0.0
  description: |
    Versioned, language-neutral API contract shared by all clients
    (web, mobile) and implemented by every backend (FastAPI reference
    today; Node/Express or others later).

    Rules (docs/architecture/ADR-001..ADR-004):
    - This file is the sole source of truth for the API boundary.
      Changes are additive-only within v1; breaking changes require
      /api/v2 plus an ADR.
    - Nothing language-specific crosses the boundary: errors use the
      Error code registry, never exception class names or framework
      shapes.

    Authentication:
    - **Local development** (`deployment_mode: local`): the server runs
      with no session secret; learner-state endpoints are accessible
      without credentials.  This mode is intentional and must not be
      promoted to shared or production deployments.
    - **Shared-demo and production** (`deployment_mode: shared-demo` or
      `production`): protected learning operations require a valid
      session.  Browser clients authenticate via a signed session cookie
      (`sessionCookie`); mobile clients authenticate via a bearer token
      (`sessionBearer`).  Requests missing or supplying an invalid
      credential receive HTTP 401 Unauthorized with an `unauthorized`
      error code.
    - `user_id` remains an anonymous scoping value (ADR-004) carried in
      request bodies; it is not an identity claim.

servers:
  - url: http://127.0.0.1:8000
    description: Local development

tags:
  - name: health
    description: Liveness probes
  - name: chat
    description: Prompt in, completion out
  - name: learning
    description: Adaptive learning state and answer evaluation

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    version: "1.0.0"

  /api/v1/chat:
    post:
      operationId: createChat
      tags: [chat]
      summary: Send a prompt; receive a completion (JSON or SSE stream)
      description: |
        With `stream: false` (default) responds with a single JSON
        ChatResponse.

        With `stream: true` responds with `text/event-stream` (ADR-003):
        one or more `delta` events carrying content fragments, then
        exactly one terminal event — `message` carrying the full
        ChatResponse on success, or `error` carrying an ErrorResponse
        on failure. The stream always closes after the terminal event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            examples:
              jsonMode:
                value:
                  prompt: "Explain API contracts in one sentence."
                  user_id: anonymous
              streamMode:
                value:
                  prompt: "Explain API contracts in one sentence."
                  stream: true
      responses:
        "200":
          description: Completion (JSON mode) or SSE stream (stream mode).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE event stream; every event payload is JSON.
                  - event `delta`: SseDeltaEvent
                  - event `message`: ChatResponse (terminal, success)
                  - event `error`: ErrorResponse (terminal, failure)
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /api/v1/learning/state:
    get:
      operationId: getLearningState
      tags: [learning]
      summary: Get learning state for a concept
      description: |
        Returns the current mastery and scheduling state for a learner/concept
        pair. Requires a valid session in shared-demo and production deployments;
        accessible without credentials in local development mode.
      security:
        - sessionCookie: []
        - sessionBearer: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: concept
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Current learning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningStateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/learning/answer:
    post:
      operationId: answerLearningQuestion
      tags: [learning]
      summary: Evaluate an answer and update learning state
      description: |
        Evaluates a free-form answer and updates the learner's mastery state.
        Requires a valid session in shared-demo and production deployments;
        accessible without credentials in local development mode.
      security:
        - sessionCookie: []
        - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningAnswerRequest"
      responses:
        "200":
          description: Answer evaluation and updated learning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningAnswerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/learning/quiz:
    get:
      operationId: getLearningQuiz
      tags: [learning]
      summary: Get a retention quiz question
      parameters:
        - name: concept
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Quiz question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningQuizResponse"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/learning/quiz/answer:
    post:
      operationId: answerLearningQuiz
      tags: [learning]
      summary: Evaluate a retention quiz answer
      description: |
        Evaluates a multiple-choice quiz answer and updates learner mastery.
        Requires a valid session in shared-demo and production deployments;
        accessible without credentials in local development mode.
      security:
        - sessionCookie: []
        - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningQuizAnswerRequest"
      responses:
        "200":
          description: |
            Quiz result, updated learning state, and adaptive teaching
            information. When the answer is incorrect, the response includes
            the correct answer, explanation, and targeted practice question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningQuizAnswerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/learning/quiz/practice:
    post:
      operationId: answerLearningPractice
      tags: [learning]
      summary: Evaluate targeted practice after adaptive teaching
      description: |
        Evaluates the learner's response to a targeted practice question
        generated after adaptive teaching.  Requires a valid session in
        shared-demo and production deployments; accessible without credentials
        in local development mode.
      security:
        - sessionCookie: []
        - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningPracticeAnswerRequest"
      responses:
        "200":
          description: Targeted practice result and updated learning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPracticeAnswerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/learning/quiz/retest:
    get:
      operationId: getLearningRetest
      tags: [learning]
      summary: Get a fresh retention retest question
      parameters:
        - name: concept
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Fresh retest question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningRetestResponse"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: answerLearningRetest
      tags: [learning]
      summary: Evaluate a retest answer and update mastery
      description: |
        Evaluates the learner's retest answer and updates mastery scheduling.
        Requires a valid session in shared-demo and production deployments;
        accessible without credentials in local development mode.
      security:
        - sessionCookie: []
        - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningRetestAnswerRequest"
      responses:
        "200":
          description: Retest result and updated learning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningRetestAnswerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  responses:
    InvalidRequest:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            emptyPrompt:
              value:
                error:
                  code: invalid_request
                  message: "prompt must be a non-empty string"

    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingSession:
              value:
                error:
                  code: unauthorized
                  message: "missing or invalid session"

    RateLimited:
      description: Too many requests; retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ProviderError:
      description: The AI provider returned an error or malformed output.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ProviderUnavailable:
      description: The requested AI provider is not configured or unreachable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        Signed session cookie issued by the backend on login.  Used by
        browser clients.  The cookie name is `session`.
    sessionBearer:
      type: http
      scheme: bearer
      description: |
        Signed session token carried as a Bearer token in the
        Authorization header.  Used by mobile and non-browser clients.

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Optional implementation or contract version.

    ChatRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        user_id:
          type: [string, "null"]
          description: |
            Anonymous scoping value (ADR-004), not an identity.
            Servers default to "anonymous" when absent.
        stream:
          type: boolean
          default: false
          description: When true, respond with an SSE event stream.

    ChatMessage:
      type: object
      required: [id, role, content, finish_reason]
      properties:
        id:
          type: string
        role:
          const: assistant
        content:
          type: string
        finish_reason:
          type: string
          enum: [stop, length]

    Usage:
      type: [object, "null"]
      description: Token accounting when the implementation provides it.
      properties:
        input_tokens:
          type: [integer, "null"]
          minimum: 0
        output_tokens:
          type: [integer, "null"]
          minimum: 0

    ChatResponse:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/ChatMessage"
        usage:
          $ref: "#/components/schemas/Usage"

    LearningStateResponse:
      type: object
      required:
        - user_id
        - concept
        - mastery
        - attempts
        - correct_count
        - next_review_at
      properties:
        user_id:
          type: string
        concept:
          type: string
        mastery:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        correct_count:
          type: integer
          minimum: 0
        last_misconception:
          type: [string, "null"]
        next_review_at:
          type: [string, "null"]
          format: date-time

    LearningAnswerRequest:
      type: object
      required:
        - user_id
        - concept
        - answer
      properties:
        user_id:
          type: string
          minLength: 1
        concept:
          type: string
          minLength: 1
        answer:
          type: string
          minLength: 1

    TeachingResponse:
      type: object
      required:
        - explanation
        - practice_question
        - choices
      properties:
        explanation:
          type: string
        practice_question:
          type: string
        choices:
          type: array
          items:
            type: string

    LearningAnswerResponse:
      type: object
      required:
        - user_id
        - concept
        - is_correct
        - mastery_before
        - mastery_after
        - attempts
        - correct_count
        - next_review_at
      properties:
        user_id:
          type: string
        concept:
          type: string
        is_correct:
          type: boolean
        misconception:
          type: [string, "null"]
        mastery_before:
          type: number
          minimum: 0
          maximum: 1
        mastery_after:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        correct_count:
          type: integer
          minimum: 0
        next_review_at:
          type: [string, "null"]
          format: date-time
        teaching:
          $ref: "#/components/schemas/TeachingResponse"

    LearningQuizResponse:
      type: object
      required:
        - concept
        - question
        - choices
        - bloom_level
      properties:
        concept:
          type: string
        question:
          type: string
        choices:
          type: array
          items:
            type: string
        bloom_level:
          type: string
          enum:
            - remember
            - understand
            - apply
            - analyze
            - evaluate
            - create

    LearningQuizAnswerRequest:
      type: object
      required:
        - user_id
        - concept
        - selected_answer
      properties:
        user_id:
          type: string
          minLength: 1
        concept:
          type: string
          minLength: 1
        selected_answer:
          type: string
          minLength: 1

    LearningQuizAnswerResponse:
      type: object
      required:
        - user_id
        - concept
        - is_correct
        - selected_answer
        - correct_answer
        - mastery_before
        - mastery_after
        - attempts
        - correct_count
        - next_review_at
      properties:
        user_id:
          type: string
        concept:
          type: string
        is_correct:
          type: boolean
        selected_answer:
          type: string
        correct_answer:
          type: string
        mastery_before:
          type: number
          minimum: 0
          maximum: 1
        mastery_after:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        correct_count:
          type: integer
          minimum: 0
        next_review_at:
          type: [string, "null"]
          format: date-time
        explanation:
          type: [string, "null"]
        misconception:
          type: [string, "null"]
        practice_question:
          type: [string, "null"]
        practice_choices:
          type: [array, "null"]
          items:
            type: string

    LearningPracticeAnswerRequest:
      type: object
      required:
        - user_id
        - concept
        - selected_answer
      properties:
        user_id:
          type: string
          minLength: 1
        concept:
          type: string
          minLength: 1
        selected_answer:
          type: string
          minLength: 1

    LearningPracticeAnswerResponse:
      type: object
      required:
        - user_id
        - concept
        - is_correct
        - selected_answer
        - correct_answer
        - mastery_before
        - mastery_after
        - attempts
        - correct_count
        - next_review_at
      properties:
        user_id:
          type: string
        concept:
          type: string
        is_correct:
          type: boolean
        selected_answer:
          type: string
        correct_answer:
          type: string
        mastery_before:
          type: number
          minimum: 0
          maximum: 1
        mastery_after:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        correct_count:
          type: integer
          minimum: 0
        next_review_at:
          type: [string, "null"]
          format: date-time
        explanation:
          type: [string, "null"]

    LearningRetestResponse:
      type: object
      required:
        - concept
        - question
        - choices
        - bloom_level
      properties:
        concept:
          type: string
        question:
          type: string
        choices:
          type: array
          items:
            type: string
        bloom_level:
          type: string
          enum:
            - remember
            - understand
            - apply
            - analyze
            - evaluate
            - create

    LearningRetestAnswerRequest:
      type: object
      required:
        - user_id
        - concept
        - selected_answer
      properties:
        user_id:
          type: string
          minLength: 1
        concept:
          type: string
          minLength: 1
        selected_answer:
          type: string
          minLength: 1

    LearningRetestAnswerResponse:
      type: object
      required:
        - user_id
        - concept
        - is_correct
        - selected_answer
        - correct_answer
        - mastery_before
        - mastery_after
        - attempts
        - correct_count
        - next_review_at
      properties:
        user_id:
          type: string
        concept:
          type: string
        is_correct:
          type: boolean
        selected_answer:
          type: string
        correct_answer:
          type: string
        mastery_before:
          type: number
          minimum: 0
          maximum: 1
        mastery_after:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        correct_count:
          type: integer
          minimum: 0
        next_review_at:
          type: [string, "null"]
          format: date-time
        misconception:
          type: [string, "null"]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, language-neutral error code registry.
          enum:
            - invalid_request
            - unauthorized
            - rate_limited
            - provider_error
            - provider_unavailable
            - internal_error
        message:
          type: string
          description: Human-readable explanation, safe to display.
        details:
          type: object
          description: Optional structured context; additive only.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    SseDeltaEvent:
      type: object
      required: [content]
      description: Payload of an SSE `delta` event in stream mode.
      properties:
        content:
          type: string
